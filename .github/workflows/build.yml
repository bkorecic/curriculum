name: Build PDF
on:
  # Triggers the workflow on push events but only for the main branch
  push:
    branches: [main]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # Sets the working directory

      - name: Download Typst and compile
        run: |
          wget https://github.com/typst/typst/releases/latest/download/typst-x86_64-unknown-linux-musl.tar.xz
          tar -xf typst-x86_64-unknown-linux-musl.tar.xz
          typst-x86_64-unknown-linux-musl/typst compile --font-path=fonts/ english.typ
          typst-x86_64-unknown-linux-musl/typst compile --font-path=fonts/ spanish.typ

      # Commit the generated pdfs on top of branch 'pdf'.
      - name: Deploy to branch
        run: |
          git fetch --depth 1 origin pdf
          git worktree add pdf-branch FETCH_HEAD
          cp english.pdf spanish.pdf pdf-branch/
          cd pdf-branch
          git add english.pdf spanish.pdf
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Update pdf to output generated at ${GITHUB_SHA::7}"
          git push origin HEAD:pdf
